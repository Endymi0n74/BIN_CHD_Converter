[package]
name="batch-convert-to-chd-next"
version="1.0.0"
edition="2021"
[build-dependencies]
tauri-build= {version="2",features= [] }
[dependencies]
tauri= {version="2",features= [] }
tauri-plugin-dialog="2"
serde= {version="1",features= ["derive"] }
walkdir="2"
tempfile="3"
[profile.release]
panic="abort"
codegen-units=1
lto=true
opt-level="s"
strip=true
