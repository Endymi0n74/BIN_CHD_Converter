name: Portable multi-platform builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, triple: x86_64-pc-windows-msvc, exe: ".exe" }
          - { os: windows-latest, rid: win-arm64, triple: aarch64-pc-windows-msvc, exe: ".exe" }
          - { os: ubuntu-24.04, rid: linux-x64, triple: x86_64-unknown-linux-gnu, exe: "" }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, triple: aarch64-unknown-linux-gnu, exe: "" }
          - { os: macos-15-intel, rid: osx-x64, triple: x86_64-apple-darwin, exe: "" }
          - { os: macos-15, rid: osx-arm64, triple: aarch64-apple-darwin, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust target
        run: rustup target add ${{ matrix.triple }}
      - name: Build native format helper
        run: dotnet publish Next.FormatHelper/Next.FormatHelper.csproj -c Release -r ${{ matrix.rid }} -o helper --self-contained true
      - name: Install frontend dependencies
        working-directory: next-app
        run: npm ci
      - name: Install Tauri sidecar
        shell: bash
        run: |
          mkdir -p next-app/src-tauri/bin
          cp "helper/batch-format-helper${{ matrix.exe }}" "next-app/src-tauri/bin/batch-format-helper-${{ matrix.triple }}${{ matrix.exe }}"
      - name: Build frontend
        working-directory: next-app
        run: npm run build
      - name: Build portable application bundle
        shell: bash
        working-directory: next-app
        run: |
          mkdir -p portable
          npx tauri build --no-bundle --target "${{ matrix.triple }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "src-tauri/target/${{ matrix.triple }}/release/bin-chd-converter.exe" portable/BIN_CHD_Converter.exe
            cp "src-tauri/bin/batch-format-helper-${{ matrix.triple }}.exe" portable/
            7z a "../BIN_CHD_Converter-${{ matrix.rid }}-portable.zip" ./portable/*
          else
            cp "src-tauri/target/${{ matrix.triple }}/release/bin-chd-converter" portable/BIN_CHD_Converter
            cp "src-tauri/bin/batch-format-helper-${{ matrix.triple }}" portable/
            tar -czf "../BIN_CHD_Converter-${{ matrix.rid }}-portable.tar.gz" -C portable .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BIN_CHD_Converter-${{ matrix.rid }}-portable
          path: BIN_CHD_Converter-${{ matrix.rid }}-portable.*
          if-no-files-found: error
      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BIN_CHD_Converter-${{ matrix.rid }}-portable.*
          generate_release_notes: true
