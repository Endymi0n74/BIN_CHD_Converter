name: Windows portable builds

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish autonomous application
        run: dotnet publish BatchConvertToCHD/BatchConvertToCHD.csproj -p:PublishProfile=${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "BatchConvertToCHD-${{ matrix.rid }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BatchConvertToCHD-${{ matrix.rid }}-portable
          path: BatchConvertToCHD-${{ matrix.rid }}-portable.zip
          if-no-files-found: error
