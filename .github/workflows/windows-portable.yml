name: Windows portable builds
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publish:
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish autonomous legacy application
        run: dotnet publish BatchConvertToCHD/BatchConvertToCHD.csproj -p:PublishProfile=${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "BIN_CHD_Converter-${{ matrix.rid }}-legacy-portable.zip"
      - name: Attach archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: BIN_CHD_Converter-${{ matrix.rid }}-legacy-portable.zip
          generate_release_notes: false
